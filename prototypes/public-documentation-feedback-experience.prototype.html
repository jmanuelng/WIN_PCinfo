<!doctype html>
<!-- Three variants of the public documentation and feedback experience, switchable via ?variant=, in one disposable standalone page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIN-PCInfo documentation experience prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233b; --muted: #5a667a; --line: #dbe2ec; --paper: #fff; --wash: #f4f7fb;
      --blue: #1267d6; --blue-dark: #0a3f8c; --cyan: #dff6ff; --green: #147d4f;
      --green-wash: #e6f7ef; --amber: #9b5d00; --amber-wash: #fff3d6; --red: #a52a2a;
      --red-wash: #fff0ee; --shadow: 0 18px 50px rgba(21, 44, 79, .12);
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--wash); color: var(--ink); }
    button, a { font: inherit; } button { cursor: pointer; } a { color: inherit; }
    :focus-visible { outline: 3px solid #ffbf47; outline-offset: 3px; }
    .skip-link { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 10px 14px; background: #111; color: #fff; }
    .skip-link:focus { top: 12px; }
    .prototype-ribbon { background: #1d2433; color: #fff; padding: 9px 18px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-align: center; }
    .prototype-ribbon span { color: #7fe7dd; }
    .app { min-height: 100vh; padding-bottom: 100px; }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(32px, 5vw, 62px); line-height: 1.03; letter-spacing: -.04em; }
    h2 { font-size: clamp(24px, 3vw, 38px); letter-spacing: -.025em; }
    h3 { font-size: 18px; } p { line-height: 1.6; } .muted { color: var(--muted); }
    .tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 700; color: var(--ink); background: #fff; }
    .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .tag.safe::before { background: var(--green); } .tag.caution::before { background: #e19b18; } .tag.danger::before { background: var(--red); }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; border-radius: 8px; border: 1px solid var(--blue); padding: 9px 15px; background: var(--blue); color: white; font-weight: 750; text-decoration: none; }
    .button.secondary { background: #fff; color: var(--blue-dark); border-color: #9ebbe1; } .button.dark { background: #16223b; border-color: #16223b; }
    .button[disabled] { opacity: .58; cursor: not-allowed; }
    .icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; font-weight: 850; color: var(--blue-dark); background: var(--cyan); }
    .notice { border-left: 5px solid var(--amber); background: var(--amber-wash); padding: 16px 18px; border-radius: 8px; }
    .danger-notice { border-left-color: var(--red); background: var(--red-wash); } .safe-notice { border-left-color: var(--green); background: var(--green-wash); }
    .notice strong { display: block; margin-bottom: 4px; } .micro { font-size: 12px; line-height: 1.45; }
    .prototype-switcher { position: fixed; z-index: 80; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; min-width: min(460px, calc(100% - 24px)); padding: 9px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; color: white; background: rgba(17, 24, 39, .96); box-shadow: 0 14px 35px rgba(0,0,0,.3); backdrop-filter: blur(14px); }
    .prototype-switcher button { width: 42px; height: 42px; flex: 0 0 auto; border: 1px solid #4e5d78; border-radius: 50%; color: #fff; background: #28354d; font-size: 22px; }
    .prototype-switcher .variant-label { flex: 1; text-align: center; } .prototype-switcher small { display: block; color: #adbbd1; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .prototype-switcher strong { font-size: 14px; }
    .toast { position: fixed; z-index: 90; right: 22px; bottom: 96px; max-width: 380px; padding: 14px 16px; border-radius: 9px; background: #10223d; color: #fff; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(10px); transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* A — guided runway */
    .a-header { background: linear-gradient(135deg, #071c3d 0%, #0b4c92 62%, #0c7b83 100%); color: white; padding: 18px 0 54px; }
    .a-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
    .brand { display: flex; gap: 11px; align-items: center; font-weight: 800; }
    .brand-mark { width: 34px; height: 34px; border: 3px solid #78e6dc; border-radius: 9px; display: grid; place-items: center; color: #78e6dc; }
    .a-header .eyebrow { color: #83ece3; }
    .a-hero { display: grid; grid-template-columns: 1.3fr .7fr; gap: 54px; align-items: end; }
    .a-hero p { color: #dbe9fb; font-size: 18px; max-width: 720px; }
    .a-trust { padding: 20px; border: 1px solid rgba(255,255,255,.26); border-radius: 14px; background: rgba(255,255,255,.09); }
    .a-trust dl { display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; margin: 18px 0 0; font-size: 13px; }
    .a-trust dt { color: #b9cce7; } .a-trust dd { margin: 0; font-weight: 700; }
    .a-path { margin-top: -24px; position: relative; }
    .a-steps { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 10px; border-radius: 15px; background: white; box-shadow: var(--shadow); overflow-x: auto; }
    .a-step { min-width: 120px; border: 0; border-radius: 10px; padding: 13px 10px; background: transparent; color: var(--muted); text-align: left; }
    .a-step b { display: block; color: inherit; font-size: 12px; margin-bottom: 5px; } .a-step.active { background: #eaf3ff; color: var(--blue-dark); }
    .a-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 26px; padding-top: 34px; }
    .a-stage, .a-rail { border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 8px 24px rgba(23,35,59,.05); }
    .a-stage { padding: 32px; } .a-stage-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
    .a-checklist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
    .a-check { padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fbfdff; }
    .a-check strong { display: block; margin: 9px 0 5px; } .a-rail { padding: 22px; }
    .a-rail section + section { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 20px; }
    .a-rail ul { padding-left: 19px; color: var(--muted); line-height: 1.65; }
    .a-next { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }

    /* B — consultant workbench */
    .b-layout { display: grid; grid-template-columns: 245px minmax(0,1fr); min-height: calc(100vh - 35px); background: #eef1f5; }
    .b-sidebar { background: #111a2b; color: #eaf1ff; padding: 24px 18px; } .b-sidebar .brand { margin-bottom: 32px; }
    .b-sidebar nav button { width: 100%; border: 0; border-left: 3px solid transparent; padding: 12px 11px; color: #b7c2d7; background: transparent; text-align: left; }
    .b-sidebar nav button.active { border-left-color: #63dfd1; background: #1c2b46; color: white; }
    .b-sidebar .privacy-lock { margin-top: 34px; padding: 14px; border: 1px solid #33435e; border-radius: 8px; color: #b9c7da; }
    .b-main { min-width: 0; } .b-topbar { min-height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 13px 28px; border-bottom: 1px solid #d4dbe5; background: white; }
    .b-content { padding: 26px 28px 120px; } .b-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .b-kpi { border: 1px solid var(--line); border-radius: 9px; padding: 15px; background: white; } .b-kpi small { display: block; color: var(--muted); margin-bottom: 8px; } .b-kpi strong { font-size: 22px; }
    .b-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 18px; margin-top: 18px; }
    .panel { border: 1px solid var(--line); border-radius: 10px; background: white; overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel-head h2, .panel-head h3 { margin: 0; font-size: 18px; }
    .journey-table { width: 100%; border-collapse: collapse; } .journey-table th, .journey-table td { padding: 13px 16px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    .journey-table th { color: var(--muted); background: #f8fafc; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    .journey-table tr[data-topic] { cursor: pointer; } .journey-table tr[data-topic]:hover { background: #f3f8ff; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 7px; }
    .b-detail { padding: 18px; } .b-detail dl { display: grid; grid-template-columns: 94px 1fr; gap: 10px; font-size: 13px; } .b-detail dt { color: var(--muted); } .b-detail dd { margin: 0; }
    .b-route { display: grid; gap: 9px; padding: 14px 18px 18px; }
    .b-route button { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 11px; background: white; text-align: left; }
    .b-route button:hover { border-color: #8db2df; background: #f6faff; } .b-route b { display: block; } .b-route small { color: var(--muted); }

    /* C — learning trail */
    .c-page { background: #fbf8f1; color: #222a38; } .c-header { padding: 22px 0 70px; background: #fbf8f1; border-bottom: 1px solid #ddd6c7; }
    .c-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 70px; } .c-nav .brand-mark { border-color: #1c6a63; color: #1c6a63; }
    .c-hero { max-width: 880px; } .c-hero h1 { font-family: Georgia, serif; font-weight: 500; max-width: 820px; } .c-hero p { font-size: 20px; color: #59606a; max-width: 720px; }
    .c-anchorbar { position: sticky; top: 0; z-index: 20; background: rgba(251,248,241,.96); border-bottom: 1px solid #ddd6c7; backdrop-filter: blur(10px); }
    .c-anchorbar .shell { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; }
    .c-anchorbar button { flex: 0 0 auto; border: 0; border-radius: 999px; padding: 8px 12px; background: transparent; color: #59606a; }
    .c-anchorbar button:hover { background: #ebe5d9; color: #222; }
    .c-story { max-width: 920px; margin: 0 auto; padding: 70px 20px 140px; } .c-chapter { display: grid; grid-template-columns: 110px 1fr; gap: 34px; padding-bottom: 74px; scroll-margin-top: 80px; }
    .c-number { font: 44px Georgia, serif; color: #167269; border-top: 2px solid #167269; padding-top: 8px; } .c-body h2 { font-family: Georgia, serif; font-weight: 500; }
    .c-card { padding: 22px; border: 1px solid #d9d2c4; border-radius: 4px; background: #fffdf8; } .c-card + .c-card { margin-top: 12px; }
    .c-explain { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; } .c-explain h3 { font-family: Georgia, serif; font-weight: 500; }
    .c-decision { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; margin-top: 20px; } .c-decision .fork { display: grid; place-items: center; color: #777; }
    .c-decision article { padding: 18px; border: 1px solid #d9d2c4; background: white; }
    .c-proof { margin-top: 28px; padding: 20px; border-top: 1px solid #d9d2c4; border-bottom: 1px solid #d9d2c4; }
    .c-proof dl { display: grid; grid-template-columns: 140px 1fr; gap: 9px; margin: 0; } .c-proof dt { color: #687078; } .c-proof dd { margin: 0; }
    @media (max-width: 900px) { .a-hero, .a-workspace, .b-grid { grid-template-columns: 1fr; } .a-checklist, .b-kpis { grid-template-columns: repeat(2, 1fr); } .b-layout { grid-template-columns: 1fr; } .b-sidebar { display: none; } }
    @media (max-width: 620px) { .shell { width: min(100% - 22px, 1220px); } .a-nav { margin-bottom: 36px; } .a-hero { gap: 22px; } .a-checklist, .b-kpis, .c-explain, .c-decision { grid-template-columns: 1fr; } .c-chapter { grid-template-columns: 1fr; gap: 14px; } .c-number { font-size: 28px; } .c-decision .fork { display: none; } .b-content { padding-left: 14px; padding-right: 14px; } .journey-table th:nth-child(3), .journey-table td:nth-child(3) { display: none; } .prototype-switcher { min-width: calc(100% - 18px); bottom: 9px; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#prototype-main">Skip to prototype</a>
  <div class="prototype-ribbon"><span>THROWAWAY PROTOTYPE</span> · SYNTHETIC RELEASE CONTENT · NO REAL DOWNLOAD OR DATA</div>
  <div id="prototype-main" class="app" tabindex="-1"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="prototype-switcher" aria-label="Prototype variant switcher">
    <button type="button" id="previous-variant" aria-label="Previous variant">←</button>
    <div class="variant-label"><small>Prototype variant</small><strong id="variant-name"></strong></div>
    <button type="button" id="next-variant" aria-label="Next variant">→</button>
  </div>
  <script>
    const variants = [{ key: "A", name: "Guided runway" }, { key: "B", name: "Consultant workbench" }, { key: "C", name: "Learning trail" }];
    const journey = [
      { key: "choose", label: "Choose", title: "Know what this example Preview can and cannot tell you", purpose: "Set expectations before download.", action: "Read the capability and supported-scenario summary for this exact release.", safety: "Results are advisory and describe one Windows client—not a tenant or entire environment.", expected: "You can name the useful outcome, the known limitations, and the required tenant-side follow-up.", next: "Verify" },
      { key: "verify", label: "Verify", title: "Establish that the release is the one the project published", purpose: "Do not run unknown code on a client you are assessing.", action: "Match the version, source revision, file digest, publisher or attestation, and release-evidence status.", safety: "A synthetic example cannot be verified or downloaded. A real guide would give copyable commands and explain every result.", expected: "Every required check passes, or you stop and troubleshoot trust before execution.", next: "Prepare" },
      { key: "prepare", label: "Prepare", title: "Review the complete plan before the device changes", purpose: "Make privilege, network, output, and prerequisite behavior understandable.", action: "Read the Preparation Summary, choose a safe local output location, and approve or decline once.", safety: "Do not select a network share, removable drive, cloud-synchronized folder, or shared directory for raw evidence.", expected: "You understand the scope, one elevation request, approved network behavior, temporary dependencies, persistent prerequisites, and evidence destination.", next: "Run" },
      { key: "run", label: "Run", title: "Observe progress without exposing evidence", purpose: "Know what the assessment is doing and when a gap matters.", action: "Follow sanitized phase and capability progress. Cancel once if needed; cleanup proceeds without another prompt.", safety: "Never paste raw console output into a public thread. Structured progress is not the evidence package.", expected: "The run ends as Completed, CompletedWithGaps, or another explicit outcome—not a vague success flag.", next: "Interpret" },
      { key: "interpret", label: "Interpret", title: "Separate observed facts, advisory interpretation, and missing discovery", purpose: "Avoid turning one-device evidence into an unsupported migration claim.", action: "Read coverage state, confidence, limitation, proposed action, and Tenant-side Discovery Tasks together.", safety: "Unavailable evidence is not a negative finding. A security control that constrained collection remains enabled.", expected: "You can explain what was observed, what remains uncertain, and which cloud-side evidence is still required.", next: "Troubleshoot" },
      { key: "troubleshoot", label: "Troubleshoot", title: "Resolve safely before retrying", purpose: "Fix eligibility or environment problems without weakening protection.", action: "Use the stable reason code, explanation, safe next step, and relevant known limitation.", safety: "Never disable UAC, Defender/EDR, firewall, TLS validation, execution controls, or another protection to force collection.", expected: "You either reach a safe retry condition or retain an explicit constrained/unsupported coverage state.", next: "Share" },
      { key: "share", label: "Share", title: "Choose the channel before choosing the attachment", purpose: "Make useful feedback possible without publishing Restricted Diagnostic Evidence.", action: "Route questions to Discussions, defects to a structured issue, changes to a signed-off pull request, and suspected vulnerabilities to private reporting.", safety: "Raw logs and complete assessment packages never belong in public threads. Only attach a separately generated, locally previewed Feedback Bundle.", expected: "The report reaches the correct channel with the smallest privacy-safe evidence needed to act.", next: "Finish" }
    ];
    const icon = text => `<span class="icon" aria-hidden="true">${text}</span>`;
    const tag = (text, type = "") => `<span class="tag ${type}">${text}</span>`;
    const chromeHeader = () => `<div class="brand"><span class="brand-mark">W</span><span>WIN-PCInfo <small style="display:block;font-weight:500;opacity:.72">Public guide prototype</small></span></div>`;

    function renderA(activeKey = "choose") {
      const active = journey.find(item => item.key === activeKey) || journey[0];
      document.querySelector("#prototype-main").innerHTML = `<main class="variant-a"><header class="a-header"><div class="shell"><div class="a-nav">${chromeHeader()} ${tag("Example Preview · synthetic", "caution")}</div><div class="a-hero"><div><div class="eyebrow">Start safely. Learn as you go.</div><h1>From first download to useful feedback—without a private handoff.</h1><p>A guided public path for evaluating what one Windows client can reveal about Microsoft cloud endpoint-management and security readiness.</p></div><aside class="a-trust"><strong>Release trust at a glance</strong><dl><dt>Status</dt><dd>Preview example</dd><dt>Trust path</dt><dd>Attestation example</dd><dt>Assessment</dt><dd>Advisory</dd><dt>Telemetry</dt><dd>None</dd><dt>Real asset</dt><dd>Not available here</dd></dl></aside></div></div></header><div class="shell a-path"><nav class="a-steps" aria-label="Evaluation journey">${journey.map((item, index) => `<button class="a-step ${item.key === active.key ? "active" : ""}" data-step="${item.key}"><b>0${index + 1}</b>${item.label}</button>`).join("")}</nav><div class="a-workspace"><article class="a-stage"><div class="a-stage-head"><div><div class="eyebrow">Step ${journey.indexOf(active) + 1} of ${journey.length}</div><h2>${active.title}</h2><p class="muted">${active.purpose}</p></div>${tag(active.label === "Share" ? "Privacy decision" : "Guided step", active.label === "Share" ? "danger" : "safe")}</div><div class="a-checklist"><div class="a-check">${icon("DO")}<strong>What you do</strong><span class="muted micro">${active.action}</span></div><div class="a-check">${icon("!")}<strong>Safety boundary</strong><span class="muted micro">${active.safety}</span></div><div class="a-check">${icon("✓")}<strong>Expected outcome</strong><span class="muted micro">${active.expected}</span></div></div>${active.key === "share" ? feedbackRouter("a") : `<div class="notice ${active.key === "interpret" ? "safe-notice" : ""}"><strong>Why this matters</strong>Each instruction pairs a procedure with its reason, expected result, stop condition, and next step. An experienced consultant can scan the labels; a new tester can expand the explanation.</div>`}<div class="a-next"><span class="muted micro">This action is simulated; the prototype never downloads or collects.</span><button class="button" data-next-step="${active.key}">${active.next} →</button></div></article><aside class="a-rail"><section><div class="eyebrow">On this step</div><h3>Fast path</h3><p class="muted micro">Purpose → action → safety boundary → expected outcome. Stop when a mandatory trust or safety condition fails.</p></section><section><h3>Need the deeper reference?</h3><ul><li>Term definitions</li><li>Capability matrix</li><li>Supported scenarios</li><li>Privacy and safe sharing</li><li>Known limitations</li></ul><button class="button secondary" data-demo="Reference map opened (simulated).">Open reference map</button></section><section><h3>One-device boundary</h3><p class="muted micro">WIN-PCInfo produces Reconstruction-ready Evidence from one client and Tenant-side Discovery Tasks for questions the client cannot answer.</p></section></aside></div></div></main>`;
    }
    function feedbackRouter(prefix) {
      return `<section aria-label="Feedback router"><h3>What are you trying to share?</h3><div class="${prefix === "a" ? "a-checklist" : "b-route"}">${routeButton("?", "Question or idea", "GitHub Discussions · no raw evidence", "Discussion route selected (simulated).")}${routeButton("!", "Reproducible defect", "Structured issue + reviewed Feedback Bundle", "Defect route selected (simulated).")}${routeButton("⇄", "Proposed code change", "Pull request · DCO sign-off required", "Contribution route selected (simulated).")}${routeButton("⌁", "Suspected vulnerability", "Private Vulnerability Reporting only", "Private security route selected (simulated).")}</div><div class="notice danger-notice"><strong>Never publish raw evidence</strong>Complete assessment packages, raw logs, native diagnostics, exact identifiers, and unreviewed screenshots are Restricted Diagnostic Evidence. A Feedback Bundle is separately generated, locally previewed, and minimized—it is not the full package with fields hidden.</div></section>`;
    }
    function routeButton(symbol, title, detail, message) {
      return `<button data-demo="${message}" style="border:1px solid var(--line);border-radius:9px;padding:12px;background:white;text-align:left;color:var(--ink)">${icon(symbol)}<span><b style="display:block;margin:8px 0 3px">${title}</b><small class="muted">${detail}</small></span></button>`;
    }
    function renderB(activeTopic = "verify") {
      const active = journey.find(item => item.key === activeTopic) || journey[1];
      document.querySelector("#prototype-main").innerHTML = `<main class="b-layout"><aside class="b-sidebar">${chromeHeader()}<nav aria-label="Workbench sections"><button class="active">Evaluation runbook</button><button data-demo="Capability matrix selected (simulated).">Capability matrix</button><button data-demo="Evidence dictionary selected (simulated).">Evidence dictionary</button><button data-demo="Known limitations selected (simulated).">Known limitations</button><button data-demo="Governance selected (simulated).">Governance</button></nav><div class="privacy-lock"><strong>Public feedback boundary</strong><p class="micro">No raw logs, complete packages, or exact identifiers. Security reports are private.</p></div></aside><section class="b-main"><header class="b-topbar"><div><strong>Evaluation workbench</strong><div class="micro muted">Example Preview · synthetic data</div></div><div>${tag("Advisory results", "caution")} ${tag("No telemetry", "safe")}</div></header><div class="b-content"><div style="display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px"><div><div class="eyebrow">Consultant fast path</div><h1 style="font-size:38px;margin-bottom:4px">Evidence-backed evaluation runbook</h1><p class="muted" style="margin:0">Dense operational view; select any row for its beginner explanation.</p></div><button class="button dark" disabled>Download unavailable</button></div><section class="b-kpis" aria-label="Release summary"><div class="b-kpi"><small>Release state</small><strong>Preview</strong><div class="micro muted">Synthetic example</div></div><div class="b-kpi"><small>Trust path</small><strong>Attested</strong><div class="micro muted">Example only</div></div><div class="b-kpi"><small>Claim level</small><strong>Advisory</strong><div class="micro muted">One device</div></div><div class="b-kpi"><small>Automatic upload</small><strong>None</strong><div class="micro muted">Local by design</div></div></section><div class="b-grid"><section class="panel"><div class="panel-head"><h2>Operator journey</h2><span class="micro muted">Select a row to explain</span></div><div style="overflow:auto"><table class="journey-table"><thead><tr><th>Stage</th><th>Exit condition</th><th>Safety check</th></tr></thead><tbody>${journey.map(item => `<tr data-topic="${item.key}" aria-current="${item.key === active.key ? "step" : "false"}" style="${item.key === active.key ? "background:#edf5ff" : ""}"><td><span class="status-dot"></span><strong>${item.label}</strong></td><td class="micro">${item.expected}</td><td class="micro muted">${item.safety}</td></tr>`).join("")}</tbody></table></div></section><aside><section class="panel"><div class="panel-head"><h3>${active.label}: explanation</h3>${tag("Progressive detail")}</div><div class="b-detail"><p><strong>${active.title}</strong></p><dl><dt>Purpose</dt><dd>${active.purpose}</dd><dt>Procedure</dt><dd>${active.action}</dd><dt>Expected</dt><dd>${active.expected}</dd><dt>Next</dt><dd>${active.next}</dd></dl></div></section><section class="panel" style="margin-top:18px"><div class="panel-head"><h3>Feedback router</h3></div><div class="b-route">${routeButton("?", "Question / idea", "Discussion", "Discussion route selected (simulated).")}${routeButton("!", "Defect", "Issue + reviewed bundle", "Defect route selected (simulated).")}${routeButton("⌁", "Security", "Private reporting", "Private security route selected (simulated).")}</div></section></aside></div><div class="notice danger-notice" style="margin-top:18px"><strong>Attachment gate</strong>Only attach a separately generated Feedback Bundle after local preview. Never attach a complete package, raw log, native diagnostic, or exact identifier to a public issue or Discussion.</div></div></section></main>`;
    }
    function renderC() {
      document.querySelector("#prototype-main").innerHTML = `<main class="c-page"><header class="c-header"><div class="shell"><div class="c-nav">${chromeHeader()} ${tag("Example Preview · synthetic", "caution")}</div><div class="c-hero"><div class="eyebrow">A learning trail for first-time testers</div><h1>Understand the promise before you trust the result.</h1><p>Seven short chapters explain not just what to do, but why, what success looks like, where to stop, and what to do next.</p><button class="button" data-scroll="chapter-1">Begin with the promise ↓</button></div></div></header><nav class="c-anchorbar" aria-label="Learning chapters"><div class="shell">${journey.map((item, index) => `<button data-scroll="chapter-${index + 1}">${index + 1}. ${item.label}</button>`).join("")}</div></nav><div class="c-story">${journey.map((item, index) => chapter(item, index)).join("")}<section class="c-chapter" id="chapter-feedback"><div class="c-number">END</div><div class="c-body"><div class="eyebrow">Send the smallest useful report</div><h2>Choose a channel that matches the risk.</h2><p>The attachment decision comes after the channel decision. Questions rarely need an attachment. A defect may use a locally previewed Feedback Bundle. A suspected vulnerability never goes into a public thread.</p><div class="c-decision"><article><h3>Public route</h3><p class="muted">Discussion for questions and ideas; structured issue for an actionable defect; signed-off pull request for a change.</p><button class="button secondary" data-demo="Public feedback checklist opened (simulated).">Review public checklist</button></article><div class="fork">OR</div><article style="border-color:#c27b71;background:#fff6f3"><h3>Private security route</h3><p class="muted">Use GitHub Private Vulnerability Reporting for suspected security vulnerabilities or exploit details.</p><button class="button dark" data-demo="Private security guidance opened (simulated).">Review private route</button></article></div><div class="notice danger-notice" style="margin-top:20px"><strong>Raw evidence stays private</strong>A complete assessment package, raw log, native diagnostic, or exact identifier is Restricted Diagnostic Evidence even if it looks harmless. Never attach it publicly.</div></div></section></div></main>`;
    }
    function chapter(item, index) {
      const special = item.key === "interpret" ? `<div class="c-proof"><dl><dt>Observed fact</dt><dd>One synthetic capability completed with bounded evidence.</dd><dt>Interpretation</dt><dd>An Advisory Result suggests a migration-planning concern.</dd><dt>Coverage</dt><dd>Partial—one source was constrained by an existing security control.</dd><dt>Next discovery</dt><dd>Complete the named Tenant-side Discovery Task before a production decision.</dd></dl></div>` : "";
      return `<section class="c-chapter" id="chapter-${index + 1}"><div class="c-number">0${index + 1}</div><div class="c-body"><div class="eyebrow">${item.label}</div><h2>${item.title}</h2><p>${item.purpose}</p><div class="c-explain"><article class="c-card"><h3>What you do</h3><p class="muted">${item.action}</p></article><article class="c-card"><h3>What good looks like</h3><p class="muted">${item.expected}</p></article></div><div class="notice ${item.key === "share" ? "danger-notice" : ""}" style="margin-top:14px"><strong>Stop / safety condition</strong>${item.safety}</div>${special}<p style="margin-top:18px"><strong>Next:</strong> ${item.next}</p></div></section>`;
    }
    function currentVariant() { const value = new URLSearchParams(location.search).get("variant")?.toUpperCase(); return variants.some(item => item.key === value) ? value : "A"; }
    function setVariant(key) { const params = new URLSearchParams(location.search); params.set("variant", key); history.replaceState(null, "", `${location.pathname}?${params.toString()}${location.hash}`); render(); window.scrollTo(0, 0); }
    function cycleVariant(direction) { const index = variants.findIndex(item => item.key === currentVariant()); setVariant(variants[(index + direction + variants.length) % variants.length].key); }
    function showToast(message) { const toast = document.querySelector("#toast"); toast.textContent = message; toast.classList.add("show"); clearTimeout(window.prototypeToastTimer); window.prototypeToastTimer = setTimeout(() => toast.classList.remove("show"), 2600); }
    function render() { const variant = currentVariant(); const record = variants.find(item => item.key === variant); document.querySelector("#variant-name").textContent = `${record.key} — ${record.name}`; document.title = `${record.key} — ${record.name} | WIN-PCInfo prototype`; if (variant === "A") renderA(window.activeAStep || "choose"); if (variant === "B") renderB(window.activeBTopic || "verify"); if (variant === "C") renderC(); }
    document.querySelector("#previous-variant").addEventListener("click", () => cycleVariant(-1));
    document.querySelector("#next-variant").addEventListener("click", () => cycleVariant(1));
    document.addEventListener("keydown", event => { const tagName = event.target.tagName?.toLowerCase(); if (["input", "textarea", "select"].includes(tagName) || event.target.isContentEditable) return; if (event.key === "ArrowLeft") cycleVariant(-1); if (event.key === "ArrowRight") cycleVariant(1); });
    document.addEventListener("click", event => { const step = event.target.closest("[data-step]"); if (step) { window.activeAStep = step.dataset.step; renderA(window.activeAStep); return; } const next = event.target.closest("[data-next-step]"); if (next) { const index = journey.findIndex(item => item.key === next.dataset.nextStep); if (index < journey.length - 1) { window.activeAStep = journey[index + 1].key; renderA(window.activeAStep); } else showToast("Journey complete. Choose the correct feedback route."); return; } const topic = event.target.closest("[data-topic]"); if (topic) { window.activeBTopic = topic.dataset.topic; renderB(window.activeBTopic); return; } const scroll = event.target.closest("[data-scroll]"); if (scroll) { document.querySelector(`#${scroll.dataset.scroll}`)?.scrollIntoView({ behavior: "smooth" }); return; } const demo = event.target.closest("[data-demo]"); if (demo) showToast(demo.dataset.demo); });
    render();
  </script>
</body>
